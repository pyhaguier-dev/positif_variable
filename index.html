function nextIndex(i){

    return (
        i + 1
    ) % numbers.length;
}

function prevIndex(i){

    return (
        i - 1 +
        numbers.length
    ) % numbers.length;
}
function createTopItem(){

    let newIndex;

        sphereItems.length === 0
    ){
        newIndex = 0;
    }
    else{

            nextIndex(

// ======================================

function moveForward(step){

    sphereItems.forEach(item=>{
        item.level += step;
    });

    sphereItems =
        sphereItems.filter(
            item => item.level < levelCount
        );

    if(
        sphereItems.length === 0 ||
        sphereItems[0].level >= 1
    ){
        createTopItem();
    }
}


function moveBackward(step){

    sphereItems.forEach(item=>{
        item.level -= step;
    });

    sphereItems =
        sphereItems.filter(
            item => item.level >= 0
        );

    if(
        sphereItems.length === 0 ||
        sphereItems[sphereItems.length-1].level <= levelCount-2
    ){

    level:

});

function loop(timestamp){

 
const params =

const cycleDuration =
    params.cycleDuration;

    phase +=
    (params.phaseStep * Math.PI)
             /
        (cycleDuration * 60);

        Math.sin(
            phase
        );

if(
    previousWave < 0 &&
    wave >= 0
){

    completedCycles++;

    if(
        completedCycles % 1 === 0
    ){

            parameterDirection;

            parameterIndex <= 0
        ){
            parameterDirection = 1;
        }

        parameterIndex =
            Math.max(
                0,
                Math.min(
                    parameterIndex,
                    parameterSets.length - 1
                )
            );

       

    }
}

previousWave = wave;
    const direction =
        wave >= 0
        ? 1
        : -1;
if(
    direction > 0 &&
    previousDirection < 0
){

   const bottomItem =
    sphereItems[
        sphereItems.length - 1
    ];



    const visibleIndex =
        numbers.indexOf(
            bottomItem.value
        );

    if(visibleIndex >= 0){

        
    }
}

previousDirection = direction;

 const speed =
        Math.abs(
            wave
        );
           


const minInterval =
    params.minInterval;
const maxInterval =
    params.maxInterval;



const equivalentInterval =
    maxInterval -
    speed *
    (
        maxInterval -
        minInterval
    );

const step =
    30 / equivalentInterval;


if(direction > 0){

}
else{

}

let wakeLock = null;

async function keepScreenAwake() {
    try {
        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
            console.log("Wake Lock released");
        });

        console.log("Screen Wake Lock active");

    } catch (err) {
        console.log("Wake Lock error:", err);
    }
}

document.addEventListener("visibilitychange", async () => {

    if (
        wakeLock !== null &&
        document.visibilityState === "visible"
    ) {
        await keepScreenAwake();
